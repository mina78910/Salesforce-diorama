<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Realtime Activity Diorama</title>
  <style>
    :root {
      --bg: #f8fbff;
      --dot: rgba(15, 44, 82, 0.18);
      --ink: #142033;
      --muted: #66758b;
      --line: #202938;
      --blue: #2f80ed;
      --cyan: #37c6d9;
      --green: #40c782;
      --orange: #ffad33;
      --pink: #ef7e9f;
      --card: rgba(255, 255, 255, 0.92);
      --shadow: rgba(20, 32, 51, 0.14);
      font-family: Inter, "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 0%, rgba(55, 198, 217, 0.14), transparent 34rem),
        radial-gradient(var(--dot) 1.5px, transparent 1.5px),
        var(--bg);
      background-size: auto, 50px 50px, auto;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: min(100vw, 1180px);
      height: 100vh;
      min-height: 720px;
      margin: 0 auto;
      padding: clamp(16px, 2.6vw, 34px);
      isolation: isolate;
    }

    .hero {
      position: absolute;
      top: clamp(18px, 3vh, 38px);
      left: 50%;
      z-index: 5;
      width: min(92%, 680px);
      transform: translateX(-50%);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(24px, 4.8vw, 48px);
      letter-spacing: -0.05em;
    }

    .hero p {
      margin: 0 auto;
      width: fit-content;
      padding: 8px 16px;
      border: 1px solid rgba(47, 128, 237, 0.18);
      border-radius: 999px;
      background: var(--card);
      box-shadow: 0 14px 36px var(--shadow);
      color: var(--muted);
      font-weight: 800;
      font-size: clamp(12px, 1.8vw, 15px);
    }

    .user-lane {
      position: absolute;
      top: 170px;
      z-index: 3;
      display: grid;
      justify-items: center;
      gap: 10px;
      width: clamp(128px, 17vw, 178px);
      padding: 14px 12px 16px;
      border: 1px solid rgba(20, 32, 51, 0.08);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 18px 40px var(--shadow);
      backdrop-filter: blur(8px);
    }

    .lane-sales { left: 5%; }
    .lane-support { left: 50%; transform: translateX(-50%); }
    .lane-admin { right: 5%; }

    .avatar {
      position: relative;
      width: 62px;
      height: 62px;
      border-radius: 22px;
      background: linear-gradient(145deg, var(--tone), color-mix(in srgb, var(--tone) 55%, #111));
      box-shadow: inset -8px -10px 0 rgba(0,0,0,0.12), 0 10px 20px rgba(0,0,0,0.10);
    }

    .avatar::before {
      content: "";
      position: absolute;
      top: 10px;
      left: 50%;
      width: 27px;
      height: 27px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #ffe0bb;
    }

    .avatar::after {
      content: "";
      position: absolute;
      left: 15px;
      right: 15px;
      bottom: 10px;
      height: 22px;
      border-radius: 16px 16px 7px 7px;
      background: rgba(255,255,255,0.85);
    }

    .screen {
      width: 96px;
      height: 62px;
      padding: 8px;
      border: 4px solid #253044;
      border-radius: 10px;
      background: linear-gradient(180deg, #ffffff, #dff4ff);
    }

    .screen span {
      display: block;
      height: 8px;
      margin-bottom: 7px;
      border-radius: 999px;
      background: var(--tone);
      opacity: 0.9;
    }

    .user-lane strong { font-size: 14px; }
    .user-lane small { color: var(--muted); font-weight: 800; }

    .wire {
      position: absolute;
      z-index: 1;
      border-color: var(--line);
      border-style: solid;
      filter: drop-shadow(0 6px 0 rgba(47, 128, 237, 0.08));
    }

    .wire-left {
      left: calc(5% + 88px);
      top: 385px;
      width: calc(45% - 88px);
      height: 95px;
      border-width: 0 0 7px 7px;
      border-radius: 0 0 0 28px;
    }

    .wire-center {
      left: 50%;
      top: 342px;
      height: 205px;
      border-width: 0 0 0 7px;
      transform: translateX(-50%);
    }

    .wire-right {
      right: calc(5% + 88px);
      top: 385px;
      width: calc(45% - 88px);
      height: 95px;
      border-width: 0 7px 7px 0;
      border-radius: 0 0 28px 0;
    }

    .junction {
      position: absolute;
      left: 50%;
      top: 470px;
      z-index: 2;
      width: 34px;
      height: 34px;
      transform: translate(-50%, -50%);
      border: 6px solid var(--line);
      border-radius: 11px;
      background: #fff;
    }

    .account-db {
      position: absolute;
      left: 50%;
      bottom: 34px;
      z-index: 4;
      width: min(88%, 560px);
      transform: translateX(-50%);
      filter: drop-shadow(0 22px 24px var(--shadow));
    }

    .db-top, .db-bottom {
      height: 64px;
      border: 7px solid var(--line);
      border-radius: 50%;
      background: linear-gradient(180deg, #ffffff, #eaf4ff);
    }

    .db-body {
      position: relative;
      margin: -32px 0;
      min-height: 230px;
      padding: 60px clamp(20px, 5vw, 44px) 52px;
      border-right: 7px solid var(--line);
      border-left: 7px solid var(--line);
      background: linear-gradient(180deg, #ffffff 0%, #edf8ff 100%);
    }

    .db-title {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 7px 15px;
      border-radius: 999px;
      background: #162033;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .records {
      display: grid;
      gap: 12px;
    }

    .record {
      display: grid;
      grid-template-columns: 92px 1fr 70px;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 3px solid rgba(20, 32, 51, 0.12);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.86);
      transition: transform .25s ease, border-color .25s ease, background .25s ease;
    }

    .record.flash {
      transform: translateX(8px) scale(1.02);
      border-color: var(--flash);
      background: color-mix(in srgb, var(--flash) 16%, white);
    }

    .pill {
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(47, 128, 237, 0.12);
      color: var(--blue);
      font-size: 12px;
      font-weight: 900;
      text-align: center;
    }

    .bars i {
      display: block;
      height: 10px;
      margin: 5px 0;
      border-radius: 999px;
      background: #c9d8ea;
    }

    .bars i:nth-child(2) { width: 74%; }
    .bars i:nth-child(3) { width: 86%; }

    .counter {
      display: grid;
      place-items: center;
      min-height: 36px;
      border-radius: 12px;
      background: #f4f8fc;
      font-size: 12px;
      font-weight: 900;
    }

    .event {
      position: absolute;
      z-index: 6;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: center;
      width: 150px;
      padding: 10px 12px;
      border: 3px solid var(--line);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 14px 26px var(--shadow);
      animation: travel 2.8s cubic-bezier(.18,.77,.28,1) forwards;
    }

    .event::before {
      content: attr(data-op);
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: var(--tone);
      color: #fff;
      font-weight: 1000;
    }

    .event b { font-size: 12px; }
    .event span { color: var(--muted); font-size: 11px; font-weight: 800; }

    .feed {
      position: absolute;
      right: clamp(12px, 3vw, 28px);
      bottom: 34px;
      z-index: 7;
      width: min(340px, 36vw);
      padding: 14px;
      border-radius: 22px;
      background: rgba(22, 32, 51, 0.88);
      color: #fff;
      box-shadow: 0 18px 46px var(--shadow);
    }

    .feed h2 { margin: 0 0 10px; font-size: 14px; }
    .feed ul { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .feed li { color: rgba(255,255,255,.82); font-size: 12px; font-weight: 800; }
    .feed em { color: #7df0ff; font-style: normal; }

    @keyframes travel {
      0% { left: var(--sx); top: var(--sy); opacity: 0; transform: translate(-50%, -50%) scale(.55) rotate(-7deg); }
      10% { opacity: 1; }
      58% { left: 50%; top: 470px; transform: translate(-50%, -50%) scale(1.02) rotate(4deg); }
      100% { left: var(--ex); top: var(--ey); opacity: 0; transform: translate(-50%, -50%) scale(.62) rotate(0); }
    }

    @media (max-width: 760px) {
      body { overflow-y: auto; }
      .stage { min-height: 860px; padding: 14px; }
      .hero { top: 14px; }
      .user-lane { top: 154px; width: 30%; min-width: 104px; padding: 10px 6px; border-radius: 20px; }
      .lane-sales { left: 1%; }
      .lane-admin { right: 1%; }
      .avatar { width: 48px; height: 48px; border-radius: 16px; }
      .screen { width: 76px; height: 50px; border-width: 3px; }
      .user-lane strong { font-size: 12px; }
      .user-lane small { font-size: 10px; }
      .wire-left, .wire-right { top: 340px; height: 78px; }
      .wire-left { left: 16%; width: 34%; }
      .wire-right { right: 16%; width: 34%; }
      .wire-center { top: 312px; height: 212px; }
      .junction { top: 414px; }
      .account-db { bottom: 156px; width: 94%; }
      .record { grid-template-columns: 74px 1fr 56px; gap: 8px; padding: 9px; }
      .feed { left: 14px; right: 14px; bottom: 16px; width: auto; }
      @keyframes travel {
        0% { left: var(--sx); top: var(--sy); opacity: 0; transform: translate(-50%, -50%) scale(.55) rotate(-7deg); }
        10% { opacity: 1; }
        58% { left: 50%; top: 414px; transform: translate(-50%, -50%) scale(1.02) rotate(4deg); }
        100% { left: var(--ex); top: var(--ey); opacity: 0; transform: translate(-50%, -50%) scale(.62) rotate(0); }
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="複数ユーザーがSalesforceの取引先オブジェクトへリアルタイムに登録・更新する様子">
    <header class="hero">
      <h1>取引先オブジェクト リアルタイム更新</h1>
      <p id="status">営業・サポート・管理者から変更イベントが流れています</p>
    </header>

    <section class="user-lane lane-sales" style="--tone: var(--blue)" data-user="sales" aria-label="営業ユーザー">
      <div class="avatar" aria-hidden="true"></div>
      <div class="screen"><span></span><span></span><span></span></div>
      <strong>営業ユーザー</strong>
      <small>新規登録</small>
    </section>

    <section class="user-lane lane-support" style="--tone: var(--green)" data-user="support" aria-label="サポートユーザー">
      <div class="avatar" aria-hidden="true"></div>
      <div class="screen"><span></span><span></span><span></span></div>
      <strong>サポート</strong>
      <small>住所・電話更新</small>
    </section>

    <section class="user-lane lane-admin" style="--tone: var(--pink)" data-user="admin" aria-label="管理者ユーザー">
      <div class="avatar" aria-hidden="true"></div>
      <div class="screen"><span></span><span></span><span></span></div>
      <strong>管理者</strong>
      <small>担当・ランク更新</small>
    </section>

    <div class="wire wire-left" aria-hidden="true"></div>
    <div class="wire wire-center" aria-hidden="true"></div>
    <div class="wire wire-right" aria-hidden="true"></div>
    <div class="junction" aria-hidden="true"></div>

    <section class="account-db" aria-label="Salesforce 取引先オブジェクト">
      <div class="db-top"></div>
      <div class="db-body">
        <div class="db-title">Account Object</div>
        <div class="records" id="records"></div>
      </div>
      <div class="db-bottom"></div>
    </section>

    <aside class="feed" aria-live="polite">
      <h2>Live Change Feed</h2>
      <ul id="feed"></ul>
    </aside>
  </main>

  <script>
    const stage = document.querySelector('.stage');
    const recordsEl = document.getElementById('records');
    const feedEl = document.getElementById('feed');
    const statusEl = document.getElementById('status');

    const users = [
      { key: 'sales', name: '営業ユーザー', op: '登録', symbol: '+', color: '#2f80ed' },
      { key: 'support', name: 'サポート', op: '更新', symbol: '↻', color: '#40c782' },
      { key: 'admin', name: '管理者', op: '更新', symbol: '✓', color: '#ef7e9f' },
    ];

    const accounts = [
      { name: 'Acme Japan', count: 0 },
      { name: 'Blue River Inc.', count: 0 },
      { name: 'North Star KK', count: 0 },
      { name: 'Cloud Nine Ltd.', count: 0 },
    ];

    accounts.forEach((account, index) => {
      const row = document.createElement('article');
      row.className = 'record';
      row.dataset.index = index;
      row.innerHTML = `
        <div class="pill">取引先 ${index + 1}</div>
        <div><strong>${account.name}</strong><div class="bars"><i></i><i></i><i></i></div></div>
        <div class="counter">0 changes</div>
      `;
      recordsEl.appendChild(row);
    });

    const recordRows = [...document.querySelectorAll('.record')];
    let tick = 0;

    function centerOf(element) {
      const stageRect = stage.getBoundingClientRect();
      const rect = element.getBoundingClientRect();
      return {
        x: rect.left - stageRect.left + rect.width / 2,
        y: rect.top - stageRect.top + rect.height / 2,
      };
    }

    function emitChange() {
      const user = users[tick % users.length];
      const accountIndex = (tick * 2 + Math.floor(tick / 3)) % accounts.length;
      const account = accounts[accountIndex];
      const lane = document.querySelector(`[data-user="${user.key}"]`);
      const target = recordRows[accountIndex];
      const start = centerOf(lane);
      const end = centerOf(target);
      const event = document.createElement('div');

      account.count += 1;
      event.className = 'event';
      event.dataset.op = user.symbol;
      event.style.setProperty('--tone', user.color);
      event.style.setProperty('--sx', `${start.x}px`);
      event.style.setProperty('--sy', `${start.y + 54}px`);
      event.style.setProperty('--ex', `${end.x}px`);
      event.style.setProperty('--ey', `${end.y}px`);
      event.innerHTML = `<div><b>${user.op}: ${account.name}</b><br><span>${user.name} → Account</span></div>`;
      stage.appendChild(event);

      statusEl.textContent = `${user.name} が「${account.name}」を${user.op}中...`;

      event.addEventListener('animationend', () => {
        event.remove();
        target.style.setProperty('--flash', user.color);
        target.classList.add('flash');
        target.querySelector('.counter').textContent = `${account.count} changes`;
        window.setTimeout(() => target.classList.remove('flash'), 520);

        const item = document.createElement('li');
        item.innerHTML = `<em>${new Date().toLocaleTimeString('ja-JP')}</em> ${user.name} が ${account.name} を${user.op}`;
        feedEl.prepend(item);
        [...feedEl.children].slice(5).forEach((child) => child.remove());
        statusEl.textContent = `取引先オブジェクトに ${account.count} 件目の変更を反映しました`;
      }, { once: true });

      tick += 1;
    }

    window.addEventListener('load', () => {
      emitChange();
      window.setInterval(emitChange, 1500);
    });

    window.addEventListener('resize', () => {
      document.querySelectorAll('.event').forEach((event) => event.remove());
    });
  </script>
</body>
</html>
