<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>取引先データ登録ライン</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(13, 28, 48, 0.86);
      --panel-light: rgba(21, 44, 72, 0.95);
      --text: #eef7ff;
      --muted: #a8bdd1;
      --blue: #38bdf8;
      --green: #4ade80;
      --yellow: #facc15;
      --orange: #fb923c;
      --steel: #8da2b8;
      --road: #1f2937;
      --road-line: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(56, 189, 248, 0.22), transparent 28rem),
        radial-gradient(circle at 86% 22%, rgba(74, 222, 128, 0.18), transparent 24rem),
        linear-gradient(180deg, #08111e 0%, #0d1726 48%, #060b13 100%);
      color: var(--text);
      font-family: "Inter", "Noto Sans JP", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .app {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 36px 0 52px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 4.7rem);
      line-height: 0.98;
      letter-spacing: -0.08em;
    }

    .lead {
      max-width: 710px;
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.8;
    }

    .status-pill {
      display: inline-grid;
      grid-template-columns: 12px auto;
      gap: 10px;
      align-items: center;
      padding: 12px 18px;
      border: 1px solid rgba(74, 222, 128, 0.35);
      border-radius: 999px;
      background: rgba(8, 30, 24, 0.72);
      box-shadow: 0 0 34px rgba(74, 222, 128, 0.13);
      color: #d9ffe7;
      white-space: nowrap;
      font-weight: 700;
    }

    .status-pill::before {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.75);
      animation: pulse 1.55s infinite;
    }

    .stage {
      position: relative;
      overflow: hidden;
      min-height: 670px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 32px;
      background:
        linear-gradient(180deg, rgba(125, 211, 252, 0.08), transparent 45%),
        rgba(4, 12, 24, 0.78);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .city-lights {
      position: absolute;
      inset: auto 0 0;
      height: 190px;
      background:
        linear-gradient(90deg, transparent 0 3%, rgba(56,189,248,.3) 3% 3.2%, transparent 3.2% 12%),
        repeating-linear-gradient(90deg, rgba(148,163,184,.18) 0 2px, transparent 2px 78px);
      opacity: .35;
    }

    .input-card {
      position: absolute;
      z-index: 3;
      left: 34px;
      top: 38px;
      width: 310px;
      padding: 20px;
      border-radius: 24px;
      background: var(--panel);
      border: 1px solid rgba(125, 211, 252, 0.22);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.35);
    }

    .card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-weight: 800;
      letter-spacing: .03em;
    }

    .tag {
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.14);
      color: #bae6fd;
      font-size: .72rem;
      font-weight: 800;
    }

    label {
      display: grid;
      gap: 6px;
      margin: 12px 0;
      color: #c8d8e8;
      font-size: .78rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      padding: 11px 12px;
      background: rgba(2, 8, 23, 0.72);
      color: var(--text);
      outline: none;
      font: inherit;
    }

    input:focus {
      border-color: rgba(56, 189, 248, 0.8);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
    }

    .submit-button {
      width: 100%;
      margin-top: 12px;
      border: 0;
      border-radius: 15px;
      padding: 13px 14px;
      background: linear-gradient(135deg, #22c55e, #38bdf8);
      color: #02111d;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(56, 189, 248, 0.24);
    }

    .road {
      position: absolute;
      z-index: 1;
      left: -30px;
      right: -30px;
      top: 290px;
      height: 160px;
      transform: skewY(-5deg);
      background:
        repeating-linear-gradient(90deg, transparent 0 65px, rgba(248,250,252,.86) 65px 118px, transparent 118px 188px) center 77px / 190px 8px repeat-x,
        linear-gradient(180deg, #303947, var(--road) 52%, #111827);
      border-top: 10px solid #44546a;
      border-bottom: 10px solid #0f172a;
      box-shadow: 0 26px 55px rgba(0,0,0,.45);
    }

    .road::before,
    .road::after {
      content: "";
      position: absolute;
      inset: 24px 0 auto;
      height: 1px;
      background: rgba(255,255,255,.16);
    }

    .sign {
      position: absolute;
      z-index: 2;
      width: 198px;
      padding: 14px 14px 16px;
      border: 4px solid rgba(255,255,255,.9);
      border-radius: 14px;
      background: linear-gradient(180deg, #0f8a48, #086238);
      box-shadow: 0 20px 35px rgba(0,0,0,.38);
      text-align: center;
      font-weight: 900;
    }

    .sign::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -116px;
      width: 10px;
      height: 112px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #6b7280, #cbd5e1, #64748b);
      border-radius: 0 0 4px 4px;
    }

    .sign small {
      display: block;
      margin-top: 5px;
      color: #d1fae5;
      font-size: .76rem;
      letter-spacing: .05em;
    }

    .sign-1 { left: 384px; top: 100px; }
    .sign-2 { left: 630px; top: 74px; background: linear-gradient(180deg, #0b72b9, #084c86); }
    .sign-3 { right: 74px; top: 120px; background: linear-gradient(180deg, #eab308, #b45309); color: #16120a; }
    .sign-3 small { color: #2b1f04; }

    .factory {
      position: absolute;
      z-index: 2;
      right: 40px;
      bottom: 42px;
      width: 640px;
      min-height: 230px;
      padding: 20px 22px 24px;
      border: 1px solid rgba(203, 213, 225, 0.24);
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(30,41,59,.98), rgba(15,23,42,.98));
      box-shadow: 0 24px 58px rgba(0,0,0,.44);
    }

    .factory-roof {
      position: absolute;
      left: 28px;
      top: -42px;
      width: 360px;
      height: 42px;
      clip-path: polygon(0 100%, 0 30%, 15% 70%, 15% 30%, 31% 70%, 31% 30%, 47% 70%, 47% 30%, 63% 70%, 63% 30%, 79% 70%, 79% 30%, 100% 100%);
      background: #334155;
    }

    .factory-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 26px;
      color: #dbeafe;
      font-weight: 900;
    }

    .meters {
      display: flex;
      gap: 8px;
    }

    .meter {
      width: 44px;
      height: 11px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(2,6,23,.72);
    }

    .meter::before {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: var(--green);
      animation: meter 1.2s ease-in-out infinite alternate;
    }

    .conveyor {
      position: relative;
      height: 88px;
      border-radius: 18px;
      background:
        repeating-linear-gradient(90deg, #64748b 0 26px, #475569 26px 52px);
      border: 8px solid #1e293b;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.1);
    }

    .roller {
      position: absolute;
      top: 19px;
      width: 34px;
      height: 34px;
      border: 6px solid #0f172a;
      border-radius: 50%;
      background: #94a3b8;
      animation: spin .85s linear infinite;
    }

    .roller:nth-child(1) { left: 32px; }
    .roller:nth-child(2) { left: 155px; }
    .roller:nth-child(3) { left: 278px; }
    .roller:nth-child(4) { left: 401px; }

    .machine {
      position: absolute;
      top: -30px;
      right: 78px;
      width: 110px;
      height: 126px;
      border-radius: 18px;
      background: linear-gradient(180deg, #64748b, #334155);
      border: 1px solid rgba(255,255,255,.2);
    }

    .machine::before {
      content: "検証\A整形";
      white-space: pre;
      position: absolute;
      inset: 14px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: rgba(15,23,42,.8);
      color: #dff7ff;
      font-weight: 900;
      line-height: 1.25;
      text-align: center;
    }

    .database {
      position: absolute;
      right: 24px;
      bottom: 24px;
      width: 130px;
      height: 132px;
      display: grid;
      place-items: center;
      color: #ecfeff;
      font-weight: 900;
    }

    .db-shape {
      position: absolute;
      inset: 0;
      border-radius: 50% / 16%;
      background: linear-gradient(180deg, #0891b2, #155e75);
      box-shadow: inset 0 12px 0 rgba(255,255,255,.22), 0 0 38px rgba(34,211,238,.2);
    }

    .db-shape::before,
    .db-shape::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 30px;
      border: 2px solid rgba(236,254,255,.38);
      border-left: 0;
      border-right: 0;
      border-radius: 50%;
    }

    .db-shape::before { top: 42px; }
    .db-shape::after { top: 78px; }
    .database span { position: relative; text-align: center; }

    .packet {
      position: absolute;
      z-index: 4;
      left: 250px;
      top: 213px;
      width: 112px;
      padding: 10px;
      border-radius: 14px;
      background: linear-gradient(135deg, #e0f2fe, #bbf7d0);
      color: #082f49;
      box-shadow: 0 16px 34px rgba(56,189,248,.32);
      font-size: .75rem;
      font-weight: 900;
      animation: drive 7.2s cubic-bezier(.62,0,.28,1) infinite;
    }

    .packet::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: -10px;
      height: 10px;
      border-radius: 0 0 12px 12px;
      background: #38bdf8;
    }

    .data-chip {
      position: absolute;
      z-index: 5;
      left: 210px;
      bottom: 116px;
      width: 84px;
      height: 54px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #fef3c7, #fdba74);
      color: #431407;
      font-size: .72rem;
      font-weight: 1000;
      box-shadow: 0 12px 24px rgba(251,146,60,.22);
      animation: belt 7.2s cubic-bezier(.65,0,.29,1) infinite;
    }

    .beam {
      position: absolute;
      z-index: 3;
      right: 163px;
      bottom: 116px;
      width: 168px;
      height: 7px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #22d3ee, transparent);
      filter: drop-shadow(0 0 12px #22d3ee);
      animation: beam 1.1s ease-in-out infinite;
    }

    .progress-track {
      position: absolute;
      left: 34px;
      right: 34px;
      bottom: 24px;
      height: 13px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.86);
      border: 1px solid rgba(148,163,184,.2);
    }

    .progress-track::before {
      content: "";
      display: block;
      width: 35%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), var(--blue), var(--yellow));
      animation: progress 7.2s linear infinite;
    }

    .step-labels {
      position: absolute;
      z-index: 4;
      left: 360px;
      right: 32px;
      bottom: 194px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      color: #dbeafe;
      font-size: .76rem;
      font-weight: 900;
      text-align: center;
    }

    .step-labels span {
      padding: 8px;
      border: 1px solid rgba(148,163,184,.22);
      border-radius: 999px;
      background: rgba(15,23,42,.72);
    }

    @keyframes pulse {
      70% { box-shadow: 0 0 0 12px rgba(74,222,128,0); }
      100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
    }

    @keyframes drive {
      0% { transform: translate(-38px, 0) scale(.72); opacity: 0; }
      9% { opacity: 1; }
      44% { transform: translate(528px, -52px) scale(.86); opacity: 1; }
      55% { transform: translate(612px, 144px) scale(.78); opacity: 0; }
      100% { transform: translate(612px, 144px) scale(.78); opacity: 0; }
    }

    @keyframes belt {
      0%, 50% { transform: translateX(-60px); opacity: 0; }
      56% { opacity: 1; }
      82% { transform: translateX(330px); opacity: 1; }
      91% { transform: translateX(420px); opacity: 0; }
      100% { transform: translateX(420px); opacity: 0; }
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes meter { to { width: 100%; background: var(--blue); } }
    @keyframes beam { 0%,100% { opacity: .22; } 50% { opacity: 1; } }
    @keyframes progress { from { transform: translateX(-105%); } to { transform: translateX(300%); } }

    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; }
      .stage { min-height: 860px; }
      .input-card { position: relative; left: 20px; top: 20px; width: calc(100% - 40px); }
      .sign-1 { left: 36px; top: 326px; }
      .sign-2 { left: 280px; top: 300px; }
      .sign-3 { right: 38px; top: 344px; }
      .road { top: 520px; }
      .factory { left: 20px; right: 20px; width: auto; bottom: 52px; }
      .step-labels { display: none; }
      .packet { left: 46px; top: 456px; }
      @keyframes drive {
        0% { transform: translate(-20px, 0) scale(.72); opacity: 0; }
        14% { opacity: 1; }
        48% { transform: translate(calc(100vw - 260px), -54px) scale(.86); opacity: 1; }
        60%, 100% { transform: translate(calc(100vw - 260px), 156px) scale(.78); opacity: 0; }
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="取引先情報の入力から保存までの可視化">
    <section class="hero">
      <div>
        <h1>取引先データが<br>保存される流れ</h1>
        <p class="lead">画面で入力された取引先情報が、高速道路の看板を通過しながら処理先へ進み、工場ラインで検証・整形されてデータベースへ格納される様子をインジケーター風に表現しています。</p>
      </div>
      <div class="status-pill">保存ライン稼働中</div>
    </section>

    <section class="stage">
      <div class="city-lights" aria-hidden="true"></div>

      <form class="input-card">
        <div class="card-title">取引先入力 <span class="tag">INPUT</span></div>
        <label>取引先名<input value="Acme Japan 株式会社" aria-label="取引先名" /></label>
        <label>業種<input value="製造・流通" aria-label="業種" /></label>
        <label>電話番号<input value="03-1234-5678" aria-label="電話番号" /></label>
        <button class="submit-button" type="button">保存キューへ送信</button>
      </form>

      <div class="sign sign-1">入力受付<small>Account Form</small></div>
      <div class="sign sign-2">処理ルート<small>Validation Lane</small></div>
      <div class="sign sign-3">DB出口<small>Save Exit</small></div>
      <div class="road" aria-hidden="true"></div>

      <div class="packet" aria-hidden="true">取引先<br>データ便</div>

      <div class="step-labels" aria-hidden="true">
        <span>受信</span><span>検証</span><span>整形</span><span>保存</span>
      </div>

      <div class="factory">
        <div class="factory-roof" aria-hidden="true"></div>
        <div class="factory-title">
          <span>データ保存ファクトリー</span>
          <div class="meters" aria-hidden="true"><span class="meter"></span><span class="meter"></span><span class="meter"></span></div>
        </div>
        <div class="conveyor" aria-label="取引先データを検証して保存するコンベア">
          <span class="roller"></span><span class="roller"></span><span class="roller"></span><span class="roller"></span>
          <span class="machine"></span>
        </div>
      </div>

      <div class="data-chip" aria-hidden="true">ACCOUNT</div>
      <div class="beam" aria-hidden="true"></div>
      <div class="database" aria-label="データベースに保存済み">
        <div class="db-shape"></div>
        <span>Database<br>保存済み</span>
      </div>

      <div class="progress-track" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
