<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database Parking Diorama</title>
  <style>
    :root {
      --bg-top: #e9f6ff;
      --bg-bottom: #f7fbff;
      --ink: #16324f;
      --accent: #2f80ed;
      --accent-dark: #1b5fb8;
      --cart: #f6b84b;
      --cart-dark: #9b6318;
      --db: #6c7a89;
      --slot: #dce8f5;
      --occupied: #ffd37a;
      --shadow: rgba(22, 50, 79, 0.18);
      font-family: "Inter", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 68%, #eef5ff 100%);
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: min(100vw, 980px);
      height: 100vh;
      min-height: 680px;
      margin: 0 auto;
      padding: clamp(14px, 3vw, 28px);
    }

    .title {
      position: relative;
      z-index: 4;
      width: fit-content;
      margin: 0 auto 10px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.78);
      box-shadow: 0 10px 30px var(--shadow);
      font-size: clamp(14px, 2.2vw, 18px);
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .people-row {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: center;
      gap: clamp(14px, 5vw, 64px);
      padding-top: clamp(4px, 2vh, 18px);
    }

    .person {
      position: relative;
      width: clamp(58px, 12vw, 92px);
      height: clamp(96px, 16vw, 132px);
    }

    .head {
      width: 34%;
      aspect-ratio: 1;
      margin: 0 auto;
      border-radius: 50%;
      background: #f3bd8d;
      border: 2px solid #c87f54;
      box-shadow: inset -5px -4px 0 rgba(138, 76, 43, 0.15);
    }

    .body {
      width: 58%;
      height: 34%;
      margin: -2px auto 0;
      border-radius: 20px 20px 8px 8px;
      background: linear-gradient(135deg, #64d2ff, var(--accent));
      border: 2px solid var(--accent-dark);
    }

    .laptop {
      position: absolute;
      left: 50%;
      bottom: 13%;
      width: 78%;
      height: 42%;
      transform: translateX(-50%);
      border-radius: 8px;
      background: linear-gradient(160deg, #f7fbff, #a7c7e8);
      border: 3px solid #3c5f81;
      box-shadow: 0 16px 24px var(--shadow);
    }

    .laptop::before {
      content: "";
      position: absolute;
      inset: 12% 16%;
      border-radius: 5px;
      background: linear-gradient(180deg, #bde9ff, #ffffff);
    }

    .laptop::after {
      content: "";
      position: absolute;
      left: 15%;
      right: 15%;
      bottom: -13px;
      height: 11px;
      border-radius: 0 0 10px 10px;
      background: #3c5f81;
    }

    .track {
      position: absolute;
      top: 155px;
      height: 205px;
      width: 6px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(47,128,237,.12), rgba(47,128,237,.5));
      transform-origin: top center;
      z-index: 1;
    }

    .track:nth-of-type(1) { left: 31%; transform: rotate(-21deg); }
    .track:nth-of-type(2) { left: 50%; height: 185px; }
    .track:nth-of-type(3) { left: 69%; transform: rotate(21deg); }

    .main-track {
      position: absolute;
      left: 50%;
      top: 330px;
      bottom: 265px;
      width: 10px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(47,128,237,.56), rgba(27,95,184,.86));
      box-shadow: 0 0 0 8px rgba(47,128,237,.08);
      z-index: 1;
    }

    .merge-hub {
      position: absolute;
      left: 50%;
      top: 322px;
      width: 34px;
      height: 34px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #fff;
      border: 5px solid var(--accent);
      box-shadow: 0 10px 20px var(--shadow);
      z-index: 2;
    }

    .db-entrance {
      position: absolute;
      left: 50%;
      bottom: 236px;
      width: 58px;
      height: 34px;
      transform: translateX(-50%);
      border-radius: 18px 18px 6px 6px;
      background: linear-gradient(180deg, #2f80ed, #1b5fb8);
      border: 4px solid #16324f;
      box-shadow: inset 0 -8px 0 rgba(0,0,0,.18), 0 10px 18px var(--shadow);
      z-index: 3;
    }

    .cart {
      position: absolute;
      top: 142px;
      left: var(--start-x);
      z-index: 5;
      width: clamp(30px, 5.6vw, 46px);
      height: clamp(26px, 4.8vw, 38px);
      transform: translate(-50%, -50%);
      animation: flyToSlot 2.55s cubic-bezier(.18,.77,.28,1) forwards;
    }

    .cart-body {
      position: absolute;
      inset: 13% 4% 22%;
      clip-path: polygon(8% 0, 92% 0, 80% 100%, 20% 100%);
      background: linear-gradient(180deg, #ffcf70, var(--cart));
      border: 3px solid var(--cart-dark);
      box-shadow: 0 11px 18px var(--shadow);
    }

    .cart::before,
    .cart::after {
      content: "";
      position: absolute;
      bottom: 3px;
      width: 16%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #34495e;
      border: 2px solid #172331;
    }

    .cart::before { left: 22%; }
    .cart::after { right: 22%; }

    .database {
      position: absolute;
      left: 50%;
      bottom: clamp(18px, 4vh, 34px);
      width: min(78%, 560px);
      transform: translateX(-50%);
      z-index: 2;
      filter: drop-shadow(0 18px 24px var(--shadow));
    }

    .db-cap,
    .db-base {
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(180deg, #8fa0b0, var(--db));
      border: 4px solid #4e5d6c;
    }

    .db-body {
      margin: -17px 0;
      padding: 44px clamp(14px, 3vw, 24px) 34px;
      min-height: 188px;
      background: linear-gradient(180deg, #7f90a0, #5f6f7f);
      border-left: 4px solid #4e5d6c;
      border-right: 4px solid #4e5d6c;
    }

    .parking-label {
      margin: -20px auto 18px;
      width: fit-content;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.82);
      font-weight: 900;
      font-size: clamp(13px, 2vw, 16px);
    }

    .parking-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(34px, 1fr));
      gap: clamp(8px, 2vw, 14px);
    }

    .slot {
      position: relative;
      min-height: clamp(38px, 6vw, 52px);
      border: 3px dashed rgba(255,255,255,0.75);
      border-radius: 12px;
      background: var(--slot);
      transition: background 280ms ease, border-color 280ms ease, transform 280ms ease;
    }

    .slot.occupied {
      background: var(--occupied);
      border-color: #fff6da;
      transform: scale(0.98);
    }

    .parked-cart {
      position: absolute;
      inset: 18% 13%;
      border-radius: 7px 7px 12px 12px;
      background: linear-gradient(180deg, #ffcf70, var(--cart));
      border: 3px solid var(--cart-dark);
    }

    .parked-cart::before,
    .parked-cart::after {
      content: "";
      position: absolute;
      bottom: -8px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #34495e;
      border: 2px solid #172331;
    }

    .parked-cart::before { left: 18%; }
    .parked-cart::after { right: 18%; }

    .status {
      position: absolute;
      left: 50%;
      bottom: calc(clamp(18px, 4vh, 34px) + 238px);
      transform: translateX(-50%);
      z-index: 4;
      width: min(88%, 520px);
      padding: 10px 16px;
      border-radius: 16px;
      background: rgba(255,255,255,0.88);
      box-shadow: 0 10px 28px var(--shadow);
      text-align: center;
      font-weight: 800;
      font-size: clamp(13px, 2vw, 16px);
    }

    @keyframes flyToSlot {
      0% { top: 142px; left: var(--start-x); opacity: 0; transform: translate(-50%, -50%) scale(.62) rotate(-7deg); }
      10% { opacity: 1; }
      34% { top: 322px; left: 50%; transform: translate(-50%, -50%) scale(.95) rotate(0deg); }
      58% { top: var(--entrance-y); left: 50%; opacity: 1; transform: translate(-50%, -50%) scale(.86) rotate(0deg); }
      76% { top: calc(var(--end-y) - 34px); left: var(--end-x); opacity: 1; transform: translate(-50%, -50%) scale(.78) rotate(0deg); }
      100% { top: var(--end-y); left: var(--end-x); opacity: 0; transform: translate(-50%, -50%) scale(.64) rotate(0deg); }
    }

    @media (max-width: 640px) {
      body { overflow-y: hidden; }
      .scene { min-height: 620px; padding: 10px 8px; }
      .people-row { gap: 6px; padding-top: 2px; }
      .person { width: 25vw; max-width: 82px; height: 108px; }
      .track { top: 132px; height: 178px; }
      .track:nth-of-type(1) { left: 20%; transform: rotate(-28deg); }
      .track:nth-of-type(2) { left: 50%; height: 168px; }
      .track:nth-of-type(3) { left: 80%; transform: rotate(28deg); }
      .merge-hub { top: 302px; }
      .main-track { top: 310px; bottom: 262px; }
      .db-entrance { bottom: 236px; }
      .cart { top: 126px; }
      .database { width: 88%; bottom: 12px; }
      .db-body { min-height: 214px; padding: 38px 12px 38px; }
      .parking-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .slot { min-height: 48px; border-radius: 10px; }
      .status { bottom: 292px; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="PCから出たトロッコがデータベース駐車場に格納されるアニメーション">
    <h1 class="title">Salesforce データ格納ジオラマ</h1>

    <section class="people-row" aria-label="PCを持った3人">
      <div class="person"><div class="head"></div><div class="body"></div><div class="laptop"></div></div>
      <div class="person"><div class="head"></div><div class="body"></div><div class="laptop"></div></div>
      <div class="person"><div class="head"></div><div class="body"></div><div class="laptop"></div></div>
    </section>

    <div class="track" aria-hidden="true"></div>
    <div class="track" aria-hidden="true"></div>
    <div class="track" aria-hidden="true"></div>
    <div class="merge-hub" aria-hidden="true"></div>
    <div class="main-track" aria-hidden="true"></div>
    <div class="db-entrance" aria-label="データベースへの一本の入口"></div>

    <p id="status" class="status">3秒ごとにPCからトロッコが出発します</p>

    <section class="database" aria-label="駐車場に見立てたデータベース">
      <div class="db-cap"></div>
      <div class="db-body">
        <div class="parking-label">DATABASE PARKING</div>
        <div id="parkingGrid" class="parking-grid" aria-live="polite"></div>
      </div>
      <div class="db-base"></div>
    </section>
  </main>

  <script>
    const scene = document.querySelector('.scene');
    const grid = document.getElementById('parkingGrid');
    const status = document.getElementById('status');
    const totalSlots = 12;
    const desktopStarts = [31, 50, 69];
    const mobileStarts = [20, 50, 80];
    let nextSlot = 0;
    let launchCount = 0;
    let intervalId;

    for (let index = 0; index < totalSlots; index += 1) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.setAttribute('aria-label', `空き駐車枠 ${index + 1}`);
      grid.appendChild(slot);
    }

    const slots = [...document.querySelectorAll('.slot')];

    function launchCart() {
      if (nextSlot >= totalSlots) {
        clearInterval(intervalId);
        status.textContent = 'データベース駐車場が満車になりました';
        return;
      }

      const slot = slots[nextSlot];
      const sceneRect = scene.getBoundingClientRect();
      const slotRect = slot.getBoundingClientRect();
      const starts = window.matchMedia('(max-width: 640px)').matches ? mobileStarts : desktopStarts;
      const startX = starts[launchCount % starts.length];
      const endX = slotRect.left - sceneRect.left + slotRect.width / 2;
      const endY = slotRect.top - sceneRect.top + slotRect.height / 2;
      const entrance = document.querySelector('.db-entrance');
      const entranceRect = entrance.getBoundingClientRect();
      const entranceY = entranceRect.top - sceneRect.top + entranceRect.height / 2;
      const cart = document.createElement('div');

      cart.className = 'cart';
      cart.innerHTML = '<div class="cart-body"></div>';
      cart.style.setProperty('--start-x', `${startX}%`);
      cart.style.setProperty('--end-x', `${endX}px`);
      cart.style.setProperty('--end-y', `${endY}px`);
      cart.style.setProperty('--entrance-y', `${entranceY}px`);
      scene.appendChild(cart);

      status.textContent = `3人のトロッコが手前で合流し、1本の入口から格納されます`;

      cart.addEventListener('animationend', () => {
        cart.remove();
        slot.classList.add('occupied');
        slot.setAttribute('aria-label', `駐車済み枠 ${nextSlot + 1}`);
        slot.innerHTML = '<div class="parked-cart" aria-hidden="true"></div>';
        nextSlot += 1;
        status.textContent = nextSlot === totalSlots
          ? '最後のトロッコが入りました。これ以上は描画しません'
          : `空き枠 ${totalSlots - nextSlot} / ${totalSlots}`;
      }, { once: true });

      launchCount += 1;
    }

    window.addEventListener('load', () => {
      launchCart();
      intervalId = setInterval(launchCart, 3000);
    });

    window.addEventListener('resize', () => {
      document.querySelectorAll('.cart').forEach((cart) => cart.remove());
    });
  </script>
</body>
</html>
